# SPDX-License-Identifier: MIT

description: Timestamp-driven Caps multi-role behavior

compatible: "zmk,behavior-caps-multi-role"

include: zero_param.yaml

properties:
  bindings:
    type: phandle-array
    required: true
    description: Tap, hold, and momentary-layer bindings

  tapping-term-ms:
    type: int
    required: true
    description: Logical deadline measured from the first press timestamp

  overlap-term-ms:
    type: int
    default: 35
    description: Minimum simultaneous press time before an overlap interrupt resolves as hold

  interrupt-flavor:
    type: string
    required: false
    default: "hold-preferred"
    enum:
      - "hold-preferred"
      - "balanced"
      - "overlap"
    description: How another key resolves an undecided first press
